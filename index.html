<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pangolimo, o pangolim</title>
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17163a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--noite:#17163a;--parede:#26234f;--lampada:#f2c46d;--texto:#efe9d6;--suave:#a9a6c8;--linha:#3a3768;--casca:#966f45;--limo:#8ad66b}
*{box-sizing:border-box}
body{margin:0;background:var(--noite);color:var(--texto);font:17px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 56px}
h1,h2{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(34px,7vw,52px);color:var(--limo)}
h2{font-size:24px;margin-bottom:14px}
#estado{margin:6px 0 20px;color:var(--suave)}
#cena{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--linha)}
.colunas{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:36px;margin-top:40px}
@media(max-width:720px){.colunas{grid-template-columns:1fr}}
.entrada{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--linha)}
.entrada time{color:var(--suave);font-size:15px}
.entrada p{margin:6px 0;max-width:62ch}
.entrada .guardou{color:var(--suave);font-style:italic;font-size:15px}
.entrada a{color:var(--lampada)}
.entrada img{display:block;width:140px;margin-top:10px;border:2px solid var(--linha);background:#f6efd8;cursor:zoom-in}
.barra{height:10px;background:var(--linha);margin:6px 0 16px}
.barra span{display:block;height:100%;background:var(--lampada)}
dl{margin:0 0 20px}dt{color:var(--suave);font-size:15px}dd{margin:0 0 8px}
#interesses{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 20px;padding:0;list-style:none}
button{font:inherit;color:var(--noite);background:var(--lampada);border:0;padding:8px 16px;cursor:pointer}
button:focus-visible,a:focus-visible,img:focus-visible{outline:3px solid var(--texto);outline-offset:2px}
#mural{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:40px}
#mural figure{margin:0}
#mural img{display:block;width:100%;border:3px solid var(--casca);background:#f6efd8;cursor:zoom-in}
#mural figcaption{font-size:15px;color:var(--suave);margin-top:4px}
dialog{border:3px solid var(--casca);background:var(--noite);color:var(--texto);padding:12px;max-width:min(92vw,640px)}
dialog::backdrop{background:#0009}
dialog img{width:100%;background:#f6efd8;display:block}
footer{margin-top:48px;color:var(--suave);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Pangolimo</h1>
  <p id="estado">Acordando…</p>
  <canvas id="cena" width="200" height="116" role="img" aria-label="A casinha do Pangolimo"></canvas>

  <div class="colunas">
    <section>
      <h2>Diário</h2>
      <div id="diario"></div>
      <button id="mais" hidden>Ver entradas mais antigas</button>
    </section>
    <aside>
      <h2>Como ele está</h2>
      <div>Energia</div>
      <div class="barra"><span id="energia"></span></div>
      <dl><dt>Humor</dt><dd id="humor"></dd><dt>Tipo</dt><dd id="tipo"></dd></dl>
      <h2>Interesses</h2>
      <ul id="interesses"></ul>
      <h2>Gostos</h2>
      <dl id="gostos"></dl>
    </aside>
  </div>

  <section>
    <h2 style="margin-top:44px">Mural</h2>
    <div id="mural"></div>
  </section>

  <footer>Pangolimo é um bichinho virtual. Ele lê artigos da Wikipédia e escreve o diário e faz os desenhos com ajuda de IA, então pode errar.</footer>
</main>
<dialog id="zoom"><img alt=""><p></p></dialog>

<script>
const SPR={
 andando:["..........kkkkkk...........","........kkblblblbkk........","......kkblblblblblbkk......","....kkblblblblblblblbkkk...","..kkblblblblblblblblbbksek.","kkbbblblblblblblblblbbkssnk","kkkkkkbbbbbbbbbbbbbbbkksssk",".....kssskkssskkssskk.kkkkk",".....kkkk.kkkk.kkkk........",".....m.....m......m........"],
 bola:["....kkkkkkkk....","..kkbblbblbbkk..","kbblbblbblbbbk..".padEnd(16,"."),"kbblbblbblbblbbk","kblbblbbkkblbblk","kbbblbbkssekbbbk","kblbblbbkkblbblk",".kbbblbblbblbbk.","..kkkkkkkkkkkk.."]
};
SPR.bola[2]=".kbblbblbblbbbk.";SPR.bola[1]="..kkbmlbblbbkk..";SPR.bola.push("...m.....m.....");
const PAL={k:"#1c3a26",b:"#4fa04a",l:"#86d36a",s:"#d3eaa6",e:"#111",n:"#16261b",m:"#b8f27c"};
const Z=["111","001","010","100","111"];
const c=document.getElementById("cena"),g=c.getContext("2d");
const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
const spr=(s,x,y)=>s.forEach((r,j)=>[...r].forEach((ch,i)=>PAL[ch]&&R(x+i,y+j,1,1,PAL[ch])));
const zzz=(x,y,col)=>Z.forEach((r,j)=>[...r].forEach((ch,i)=>ch==="1"&&R(x+i,y+j,1,1,col)));
let estado=null,diario=[],imgs=[],quadro=0;
const reduzMovimento=matchMedia("(prefers-reduced-motion: reduce)").matches;

function cena(){
  const acao=estado?estado.acao:"pesquisando";
  R(0,0,200,116,"#26234f");R(0,80,200,36,"#7a5238");R(0,80,200,2,"#5a3b28");
  for(let x=0;x<200;x+=22)R(x,82,1,34,"#6a4630");
  R(0,76,200,4,"#3a3768");
  // janela com lua e estrelas
  R(77,11,32,30,"#5a3b28");R(79,13,28,26,"#12122e");R(92,13,2,26,"#5a3b28");R(79,25,28,2,"#5a3b28");
  R(98,17,5,5,"#f2e6b8");R(100,17,3,4,"#12122e");
  [[82,16],[86,31],[96,32],[83,22]].forEach(([x,y],i)=>R(x,y,1,1,(quadro+i)%4?"#f2e6b8":"#6b6a9a"));
  // cama
  R(6,70,56,12,"#5a3b28");R(6,66,3,16,"#46301f");R(59,66,3,16,"#46301f");
  R(9,60,50,10,"#d8cfe8");R(10,57,13,6,"#efe9d6");R(26,60,33,10,"#c0504d");R(26,60,33,2,"#d46c68");
  // mesa e computador
  R(84,66,48,4,"#8a5a3a");R(87,70,3,12,"#5a3b28");R(126,70,3,12,"#5a3b28");
  R(105,62,6,4,"#46301f");R(96,40,24,22,"#2b2b3d");R(98,42,20,17,"#0f2a2e");
  const pes=acao==="pesquisando";
  for(let i=0;i<5;i++){const w=6+((i*7+(pes?quadro:0))%12);R(100,44+i*3,w,1,pes?"#7fe0c0":"#2f6b66")}
  R(122,60,6,5,"#c0a060");
  // mural
  R(136,8,58,52,"#7a4e2c");R(139,11,52,46,"#c28f55");
  imgs.slice(0,4).forEach((im,i)=>{
    const x=142+(i%2)*25,y=14+Math.floor(i/2)*21;
    R(x-1,y-1,24,18,"#f6efd8");
    if(im.complete&&im.naturalWidth){g.drawImage(im,x,y,22,16)}
    R(x+9,y-3,3,2,"#c0504d");
  });
  // pangolim
  const pocaX=acao==="dormindo"?32:acao==="desenhando"?152:59;
  if(acao!=="dormindo"){g.fillStyle="rgba(138,214,107,.35)";g.fillRect(pocaX,98,26,2)}
  const b=reduzMovimento?0:quadro%2;
  if(acao==="dormindo"){spr(SPR.bola,30,51+b);
    if(!reduzMovimento){const n=quadro%3;[0,1,2].slice(0,n+1).forEach(k=>zzz(48+k*5,44-k*6,"#f2e6b8"))}
    else zzz(48,44,"#f2e6b8");
  }else if(acao==="desenhando"){spr(SPR.andando,150,88+b);R(179,90+b,2,2,"#f2c46d")}
  else{spr(SPR.andando,57,88+b)}
}
function loop(){quadro++;cena();setTimeout(loop,450)}

const q=s=>document.querySelector(s);
const quando=iso=>new Date(iso).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const texto=(t,tag="p",cls="")=>{const e=document.createElement(tag);e.textContent=t;if(cls)e.className=cls;return e};
const FRASES={dormindo:"está dormindo",pesquisando:"está pesquisando no computador",desenhando:"está desenhando no mural"};

function zoom(src,titulo){const d=q("#zoom");d.querySelector("img").src=src;d.querySelector("img").alt=titulo;d.querySelector("p").textContent=titulo;d.showModal()}
q("#zoom").addEventListener("click",()=>q("#zoom").close());

function miniatura(src,titulo){const i=document.createElement("img");i.src=src;i.alt=titulo||"Desenho do Pangolimo";i.tabIndex=0;
  i.onclick=()=>zoom(src,titulo);i.onkeydown=e=>{if(e.key==="Enter")zoom(src,titulo)};return i}

let mostrados=0;
function mais(){
  const lista=[...diario].reverse(),box=q("#diario");
  lista.slice(mostrados,mostrados+10).forEach(d=>{
    const e=document.createElement("article");e.className="entrada";
    e.append(texto(`${quando(d.quando)}, lendo sobre ${d.tema}`,"time"),texto(d.texto));
    if(d.aprendeu)e.append(texto("Guardou: "+d.aprendeu,"p","guardou"));
    if(d.desenho)e.append(miniatura(d.desenho,d.titulo_desenho));
    if(d.fonte){const a=document.createElement("a");a.href=d.fonte;a.textContent="Artigo que ele leu";a.rel="noopener";const p=document.createElement("p");p.append(a);e.append(p)}
    box.append(e);
  });
  mostrados+=10;q("#mais").hidden=mostrados>=lista.length;
}
q("#mais").onclick=mais;

async function carregar(){
  const t="?t="+Date.now();
  [estado,diario]=await Promise.all([fetch("estado.json"+t).then(r=>r.json()),fetch("diario.json"+t).then(r=>r.json())]);
  const nome=estado.nome||"Pangolimo";
  q("h1").textContent=nome;document.title=`${nome}, o ${estado.especie}`;
  const quanto=estado.ultima_execucao?Math.max(0,Math.round((Date.now()-new Date(estado.ultima_execucao))/36e5)):null;
  q("#estado").textContent=`${nome} ${FRASES[estado.acao]||"está por aí"}.`+(quanto===null?"":quanto<1?" Atualizado agora há pouco.":` Última atualização há ${quanto} h.`);
  c.setAttribute("aria-label",`A casinha do ${nome}: ele ${FRASES[estado.acao]||"está por aí"}.`);
  q("#energia").style.width=estado.energia+"%";q("#humor").textContent=estado.humor;q("#tipo").textContent=estado.tipo||"";
  const ul=q("#interesses");ul.replaceChildren();
  estado.interesses.slice(0,14).forEach(i=>{const li=document.createElement("li");li.textContent=i.tema;li.style.fontSize=(15+Math.min(i.peso,10)*1.2)+"px";ul.append(li)});
  const gl=q("#gostos");gl.replaceChildren();
  Object.entries(estado.gostos).forEach(([k,v])=>{gl.append(texto(k.replaceAll("_"," "),"dt"),texto(v,"dd"))});
  const comDesenho=[...diario].reverse().filter(d=>d.desenho);
  imgs=comDesenho.slice(0,4).map(d=>{const i=new Image();i.src=d.desenho;return i});
  const mural=q("#mural");mural.replaceChildren();
  comDesenho.slice(0,24).forEach(d=>{const f=document.createElement("figure");f.append(miniatura(d.desenho,d.titulo_desenho),texto(d.titulo_desenho||d.tema,"figcaption"));mural.append(f)});
  if(!comDesenho.length)mural.append(texto("O mural está vazio. Os desenhos aparecem aqui depois que o Pangolimo começar a pesquisar.","p"));
  if(!diario.length)q("#diario").append(texto("O Pangolimo ainda não escreveu nada. A primeira entrada aparece depois da primeira execução.","p"));
  mostrados=0;q("#diario").querySelectorAll(".entrada").forEach(e=>e.remove());mais();
}
carregar().then(()=>reduzMovimento?(cena(),imgs.forEach(i=>i.onload=cena)):loop()).catch(()=>{q("#estado").textContent="Não consegui abrir o estado do Pangolimo. Confira se estado.json e diario.json estão no repositório."});
setInterval(async()=>{try{const e=await fetch("estado.json?t="+Date.now()).then(r=>r.json());if(!estado||e.ultima_execucao!==estado.ultima_execucao)await carregar()}catch(_){}},30000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
